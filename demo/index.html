<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NIBE F750 · Dashboard preview</title><style>body{margin:0;background:#eef3f4;color:#203344;font-family:Inter,system-ui,sans-serif}main{max-width:1160px;margin:40px auto;padding:0 18px}nav{display:flex;justify-content:space-between;margin-bottom:22px;font-size:13px;color:#596d7d}a{color:#24715b}h1{font-weight:500}button{cursor:pointer}</style></head><body><main><nav><span>F750 / Dashboard preview</span><a href="https://www.home-assistant.io/integrations/myuplink/">Built-in myUplink integration ↗</a></nav><nibe-f750-card></nibe-f750-card><p style="font-size:12px;color:#596d7d">Sample data only · <button id="unavailable">Toggle unavailable readings</button></p></main><script type="module">
import '../dist/nibe-f750-card.js';
const card = document.querySelector('nibe-f750-card');
const values = {pump_speed:68,outdoor:4.2,room:21.3,hot_water:49.6,hot_water_charge:47.8,hot_gas:63.2,suction:-2.1,heating_supply:34.8,heating_return:29.1,heater_out:34.8,supply:34.8,return:29.1,exhaust_air:21.1,leaving_air:-3.2,evaporator:-7.4,condenser:38.2,compressor_frequency:52,heater_power:0,electrical_power:1.1,cop:3.4,condenser_water_out:34.7,air_flow:180,reference_air_flow:210,operation:'Space heating'};
const units = {pump_speed:'%',compressor_frequency:'Hz',heater_power:'kW',electrical_power:'kW',cop:'',operation:'',condenser_water_out:'°C',air_flow:'m³/h',reference_air_flow:'M3/h'};
const states = Object.fromEntries(Object.entries(values).map(([key,value])=>[`sensor.demo_${key}`,{state:String(value),attributes:{unit_of_measurement:units[key]??'°C'}}]));
card.setConfig({type:'custom:nibe-f750-card',demo:true,entities:Object.fromEntries(Object.keys(values).map(k=>[k,`sensor.demo_${k}`]))});
const hass={states,callService:async(domain,service,data)=>{hass.states={...hass.states,[data.entity_id]:{...hass.states[data.entity_id],state:String(data.value??data.option)}};card.hass=hass;}};
card.hass=hass;
let offline=false;
document.getElementById('unavailable').onclick=()=>{offline=!offline;hass.states={...hass.states,...Object.fromEntries(Object.keys(values).map(k=>[`sensor.demo_${k}`,{...states[`sensor.demo_${k}`],state:offline?'unavailable':String(values[k])}]))};card.hass=hass;};
window.demoHass=hass;
</script></body></html>
